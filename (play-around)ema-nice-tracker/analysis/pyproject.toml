[project]
name = "ema-nice-analysis"
version = "0.1.0"
description = "LLM extraction, dataset assembly and quality checks for ema-nice-tracker"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "requests>=2.32",
    "pypdf>=5.0",
    "rouge-score>=0.1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ema-nice-analysis = "ema_nice_analysis.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
